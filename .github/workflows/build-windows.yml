
name: Build Langan for Older Intel CPUs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        env:
          CMAKE_ARGS: "-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF"
        run: |
          python -m pip install --upgrade pip
          pip install --no-binary=llama-cpp-python -r requirements.txt
          pip install pyinstaller

      - name: Check AI engine
        run: |
          python -c "from llama_cpp import Llama; print('Compatible AI engine installed')"

      - name: Build Langan
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Langan --collect-all llama_cpp --collect-all huggingface_hub --hidden-import=llama_cpp --hidden-import=huggingface_hub app.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Langan-Windows-AVX
          path: dist/Langan.exe
          retention-days: 30
