
name: Build Langan for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Langan
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Langan app.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Langan-Windows
          path: dist/Langan.exe
          retention-days: 30
