
name: Build Langan for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install pyinstaller

      - name: Check AI engine imports
        run: |
          python -c "from llama_cpp import Llama; from huggingface_hub import hf_hub_download; print('AI dependencies imported successfully')"

      - name: Build Langan
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Langan --collect-all llama_cpp --collect-all huggingface_hub --hidden-import=llama_cpp --hidden-import=huggingface_hub app.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Langan-Windows
          path: dist/Langan.exe
          retention-days: 30
